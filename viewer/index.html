<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RFUGM Dojo Viewer</title>
<!--
  Load order matters here: js-yaml's UMD wrapper only exposes the global
  `jsyaml` when no AMD loader is present. Monaco's loader.js defines
  `define.amd`, which makes js-yaml silently skip the global export instead.
  js-yaml MUST stay listed before loader.js, or config loading breaks with
  no visible error.
-->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="vendor/monaco/min/vs/loader.js"></script>
<script src="robotframework-language.js"></script>
<style>
  :root {
    color-scheme: light;
    --border: #d0d7de; --bg-nav: #f6f8fa; --accent: #0969da;
    --bg-page: #ffffff; --text: #1f2328; --search-hit-bg: #fff8c5;
    --error-bg: #ffebe9; --error-text: #82071e; --error-border: #ffc1c1;
    --accent-fg: #ffffff; --accent-fg-muted: #d0d7de; --text-muted: #57606a;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --border: #30363d; --bg-nav: #161b22; --accent: #58a6ff;
    --bg-page: #0d1117; --text: #c9d1d9; --search-hit-bg: #4d3800;
    --error-bg: #3d1a1a; --error-text: #ffb3ab; --error-border: #6e2c2c;
    --accent-fg: #0d1117; --accent-fg-muted: #24292f; --text-muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg-page); color: var(--text); }
  header { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--border); }
  header img.logo { height: 72px; }
  :root[data-theme="dark"] header img.logo { filter: invert(1) hue-rotate(180deg); }
  header a { color: var(--accent); }
  header h1 { font-size: 1.1rem; margin: 0; }
  #layout { display: grid; grid-template-columns: 240px 1fr; height: calc(100vh - 106px); }
  #rounds-nav { border-right: 1px solid var(--border); background: var(--bg-nav); overflow-y: auto; padding: 0.5rem; }
  #rounds-nav ul { list-style: none; margin: 0; padding: 0; }
  #rounds-nav li { padding: 0.5rem 0.75rem; border-radius: 6px; cursor: pointer; }
  #rounds-nav li.active { background: var(--accent); color: var(--accent-fg); }
  #rounds-nav li .round-title { display: block; }
  #rounds-nav li .round-description { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }
  #rounds-nav li.active .round-description { color: var(--accent-fg-muted); }
  #main { display: flex; flex-direction: column; overflow: hidden; }
  #participant-tabs { display: flex; gap: 0.25rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); overflow-x: auto; }
  #participant-tabs button { border: 1px solid var(--border); background: var(--bg-page); border-radius: 6px; padding: 0.35rem 0.75rem; cursor: pointer; color: var(--text); }
  #participant-tabs button.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #content { flex: 1; overflow: auto; padding: 1rem; }
  #status-bar { padding: 0.25rem 1rem; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border); }
  dialog#token-dialog { border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; background: var(--bg-page); color: var(--text); }
  dialog#token-dialog input { width: 320px; padding: 0.4rem; }
  #error-banner { background: var(--error-bg); color: var(--error-text); padding: 0.5rem 1rem; border-bottom: 1px solid var(--error-border); }
  .search-hit { background: var(--search-hit-bg); }
  #dojo-select { margin-left: auto; padding: 0.3rem 0.5rem; }
  #file-view { display: flex; height: 100%; }
  #explorer { width: 220px; border-right: 1px solid var(--border); overflow-y: auto; padding: 0.5rem; flex-shrink: 0; }
  #explorer ul { list-style: none; margin: 0; padding-left: 1rem; }
  #explorer > ul { padding-left: 0; }
  #explorer li.file { cursor: pointer; padding: 0.1rem 0; }
  #explorer li.file:hover { text-decoration: underline; }
  #explorer li.file.active { font-weight: 600; color: var(--accent); }
  #file-view-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  #tab-bar { display: flex; gap: 0.25rem; padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; }
  #tab-bar .tab { display: flex; align-items: center; gap: 0.35rem; border: 1px solid var(--border); border-radius: 6px; padding: 0.2rem 0.5rem; background: var(--bg-page); cursor: pointer; font-size: 0.85rem; color: var(--text); }
  #tab-bar .tab.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #tab-bar .tab .close { opacity: 0.7; }
  #tab-bar .tab .close:hover { opacity: 1; }
  #editor-pane { flex: 1; min-width: 0; }
</style>
<script>
  // Keep this literal in sync with THEME_KEY in the main script below.
  document.documentElement.dataset.theme = localStorage.getItem('rf_dojos_theme') || 'light';
</script>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="RFUGM Logo">
  <h1>RFUGM Dojo Viewer</h1>
  <span id="dojo-title"></span>
  <select id="dojo-select">
    <option value="">Dojo wählen…</option>
  </select>
  <button id="theme-toggle-btn" type="button" title="Theme wechseln">🌙</button>
  <a href="../">Zur Startseite</a>
  <button id="change-token-btn" type="button">Token ändern</button>
</header>
<div id="error-banner" style="display:none;"></div>
<div id="layout">
  <nav id="rounds-nav"><ul id="rounds-list"></ul></nav>
  <div id="main">
    <div id="participant-tabs"></div>
    <div id="content">
      <p id="content-message" style="display:none;"></p>
      <div id="tree-view"></div>
      <div id="file-view" style="display:none;">
        <div id="explorer"></div>
        <div id="file-view-main">
          <div id="tab-bar"></div>
          <div id="editor-pane"></div>
        </div>
      </div>
    </div>
    <div id="status-bar"></div>
  </div>
</div>
<dialog id="token-dialog">
  <form method="dialog" id="token-form">
    <p>GitHub Personal Access Token eingeben (Scope <code>public_repo</code>).<br>
    Wird nur lokal in diesem Browser gespeichert, nie im Repo.</p>
    <input type="password" id="token-input" placeholder="ghp_...">
    <button type="submit">Speichern</button>
    <br><small id="token-error" style="color:var(--error-text); display:none;">Bitte ein Token eingeben.</small>
  </form>
</dialog>
<script>
const TOKEN_KEY = 'rf_dojos_github_token';

function getUrlParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || '';
}

function setToken(value) {
  localStorage.setItem(TOKEN_KEY, value);
}

const THEME_KEY = 'rf_dojos_theme';

function getTheme() {
  return localStorage.getItem(THEME_KEY) || 'light';
}

function setTheme(theme) {
  localStorage.setItem(THEME_KEY, theme);
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-toggle-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
  if (typeof monaco !== 'undefined' && monacoEditor) {
    monaco.editor.setTheme(theme === 'dark' ? 'rf-dark' : 'rf-light');
  }
}

function toggleTheme() {
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
}

function decodeBase64Utf8(b64) {
  return new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
}

let monacoEditor = null;
const modelCache = new Map(); // key: `${owner}::${branch}::${relPath}` -> monaco.editor.ITextModel
const fileContentCache = new Map(); // key: `${owner}::${branch}::${path}` -> Promise<string>
const fileTreeCache = new Map(); // key: `${owner}::${branch}` -> Promise<string[]>

const LANG_BY_EXT = {
  robot: 'robotframework', resource: 'robotframework', py: 'python',
  yaml: 'yaml', yml: 'yaml', json: 'json', md: 'markdown',
  xml: 'xml', html: 'html', txt: 'plaintext',
};

function languageForPath(relPath) {
  const ext = relPath.split('.').pop().toLowerCase();
  return LANG_BY_EXT[ext] || 'plaintext';
}

function loadFileContentCached(owner, path, branch) {
  const key = `${owner}::${branch}::${path}`;
  if (!fileContentCache.has(key)) {
    // Don't let a rejected promise poison the cache forever - e.g. GitHub's
    // Contents API 403s on blobs over ~1MB (accidentally committed
    // output.xml/log.html). Remove the entry on failure so a later attempt
    // (or a blacklist fix) can retry instead of being stuck for the session.
    fileContentCache.set(key, loadFileContent(owner, path, branch).catch((err) => {
      fileContentCache.delete(key);
      throw err;
    }));
  }
  return fileContentCache.get(key);
}

function loadFileTreeCached(owner, branch) {
  const key = `${owner}::${branch}`;
  if (!fileTreeCache.has(key)) {
    fileTreeCache.set(key, loadFileTree(owner, branch).catch((err) => {
      fileTreeCache.delete(key);
      throw err;
    }));
  }
  return fileTreeCache.get(key);
}

async function computeSearchMatchingPaths(owner, visibleRelPaths, absoluteByRel, branch, searchPattern) {
  if (!searchPattern) return new Set();
  // Each file's fetch is tolerated independently - one unreadable/oversized
  // file should just fail to get a search badge, not blank the whole
  // explorer/tabs/editor via a rejected Promise.all.
  const results = await Promise.all(visibleRelPaths.map((relPath) =>
    loadFileContentCached(owner, absoluteByRel.get(relPath), branch)
      .then((content) => (contentMatchesSearch(content, searchPattern) ? relPath : null))
      .catch(() => null)
  ));
  return new Set(results.filter(Boolean));
}

function ensureEditorInstance() {
  if (monacoEditor) return monacoEditor;
  monacoEditor = monaco.editor.create(document.getElementById('editor-pane'), {
    readOnly: true,
    theme: getTheme() === 'dark' ? 'rf-dark' : 'rf-light',
    automaticLayout: true,
    minimap: { enabled: false },
  });
  // The editor is read-only, so losing in-editor arrow-key cursor movement
  // (while it has focus) is an accepted trade-off in favor of the
  // moderator's participant/round navigation always working, even after
  // clicking inside the editor. Mouse click/drag and Ctrl+F still work.
  monacoEditor.addCommand(monaco.KeyCode.LeftArrow, () => goToPrevParticipant());
  monacoEditor.addCommand(monaco.KeyCode.RightArrow, () => goToNextParticipant());
  monacoEditor.addCommand(monaco.KeyCode.UpArrow, () => goToPrevRound());
  monacoEditor.addCommand(monaco.KeyCode.DownArrow, () => goToNextRound());
  return monacoEditor;
}

const searchDecorationIdsByModel = new WeakMap(); // model -> decoration id array (per-model, not global)
// model -> the searchPattern that last triggered a revealRangeInCenter for
// THAT model. Deliberately per-model (not a single last-applied pair):
// switching to another tab and back reuses the same cached model instance,
// so a single global "last applied" value would get overwritten by the
// intermediate tab and still incorrectly re-reveal on return. Per-model
// tracking means a given file's "already revealed once" memory survives
// visits to other tabs in between.
const lastRevealedPatternByModel = new WeakMap();

function applySearchDecorations(searchPattern) {
  const editor = ensureEditorInstance();
  const model = editor.getModel();
  if (!model) return;
  const previousIds = searchDecorationIdsByModel.get(model) || [];
  if (!searchPattern) {
    searchDecorationIdsByModel.set(model, model.deltaDecorations(previousIds, []));
    return;
  }
  const matches = model.findMatches(searchPattern, false, true, false, null, false);
  const newIds = model.deltaDecorations(previousIds, matches.map((m) => ({
    range: m.range,
    options: { inlineClassName: 'search-hit' },
  })));
  searchDecorationIdsByModel.set(model, newIds);
  // Only snap the viewport to the first match the first time this exact
  // (model, pattern) pair is applied. Re-renders that land back on the same
  // model with the same pattern - e.g. clicking a different tab and back,
  // or closing an unrelated tab - must not discard the moderator's scroll
  // position within this file.
  if (matches.length && lastRevealedPatternByModel.get(model) !== searchPattern) {
    editor.revealRangeInCenter(matches[0].range);
  }
  lastRevealedPatternByModel.set(model, searchPattern);
}

async function getModelFor(owner, relPath, absolutePath, branch) {
  const key = `${owner}::${branch}::${relPath}`;
  let model = modelCache.get(key);
  if (!model) {
    model = monaco.editor.createModel(await loadFileContentCached(owner, absolutePath, branch), languageForPath(relPath));
    modelCache.set(key, model);
  }
  return model;
}

async function openFileInEditor(owner, relPath, absolutePath, branch) {
  const model = await getModelFor(owner, relPath, absolutePath, branch);
  ensureEditorInstance().setModel(model);
}

function renderTabBar() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  state.openTabs.forEach((relPath) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (relPath === state.activeTabPath ? ' active' : '');
    const label = document.createElement('span');
    label.textContent = relPath.split('/').pop();
    label.title = relPath;
    tab.appendChild(label);
    const close = document.createElement('span');
    close.className = 'close';
    close.textContent = '✕';
    close.addEventListener('click', (event) => {
      event.stopPropagation();
      closeTab(relPath);
    });
    tab.appendChild(close);
    tab.addEventListener('click', () => switchToTab(relPath));
    bar.appendChild(tab);
  });
}

async function switchToTab(relPath) {
  state.activeTabPath = relPath;
  renderTabBar();
  renderContent();
}

function closeTab(relPath) {
  state.openTabs = state.openTabs.filter((p) => p !== relPath);
  if (state.activeTabPath === relPath) {
    state.activeTabPath = state.openTabs[state.openTabs.length - 1] || null;
  }
  renderTabBar();
  renderContent();
}

function openTab(relPath) {
  if (!state.openTabs.includes(relPath)) state.openTabs.push(relPath);
  state.activeTabPath = relPath;
}

function showContentMessage(text) {
  const messageEl = document.getElementById('content-message');
  messageEl.textContent = text;
  messageEl.style.display = text ? '' : 'none';
  document.getElementById('tree-view').style.display = 'none';
  document.getElementById('file-view').style.display = 'none';
}

const state = {
  dojoId: getUrlParam('dojo'),
  token: getToken(),
  config: null,
  prs: [],
  currentRoundIndex: 0,
  currentParticipantIndex: 0,
  activeTabPath: null,
  openTabs: [],
  needsDefaultOpen: true,
};

function selectParticipant(index) {
  state.currentParticipantIndex = index;
  state.openTabs = [];
  state.activeTabPath = null;
  state.needsDefaultOpen = true;
  render();
}

function selectRound(index) {
  state.currentRoundIndex = index;
  state.openTabs = [];
  state.activeTabPath = null;
  state.needsDefaultOpen = true;
  render();
}

// Shared by the document-level keydown handler and the Monaco editor's own
// key bindings (see ensureEditorInstance) so both stay in sync.
function goToNextParticipant() {
  if (!state.prs.length) return;
  selectParticipant((state.currentParticipantIndex + 1) % state.prs.length);
}

function goToPrevParticipant() {
  if (!state.prs.length) return;
  selectParticipant((state.currentParticipantIndex - 1 + state.prs.length) % state.prs.length);
}

function goToNextRound() {
  const n = (state.config?.rounds || []).length;
  if (!n) return;
  selectRound((state.currentRoundIndex + 1) % n);
}

function goToPrevRound() {
  const n = (state.config?.rounds || []).length;
  if (!n) return;
  selectRound((state.currentRoundIndex - 1 + n) % n);
}

function renderRoundsNav() {
  const list = document.getElementById('rounds-list');
  list.innerHTML = '';
  (state.config?.rounds || []).forEach((round, index) => {
    const li = document.createElement('li');
    li.className = index === state.currentRoundIndex ? 'active' : '';

    const titleEl = document.createElement('span');
    titleEl.className = 'round-title';
    titleEl.textContent = round.title;
    li.appendChild(titleEl);

    if (round.description) {
      const descEl = document.createElement('small');
      descEl.className = 'round-description';
      descEl.textContent = round.description;
      li.appendChild(descEl);
    }

    li.addEventListener('click', () => selectRound(index));
    list.appendChild(li);
  });
}

function renderParticipantTabs() {
  const container = document.getElementById('participant-tabs');
  container.innerHTML = '';
  state.prs.forEach((pr, index) => {
    const btn = document.createElement('button');
    btn.textContent = pr.username;
    btn.className = index === state.currentParticipantIndex ? 'active' : '';
    btn.addEventListener('click', () => selectParticipant(index));
    container.appendChild(btn);
  });
}

function render() {
  document.getElementById('dojo-title').textContent = state.config ? state.config.dojo.title : '';
  renderRoundsNav();
  renderParticipantTabs();
  document.getElementById('status-bar').textContent =
    `Teilnehmer: ${state.prs.length} PRs`;
  renderContent();
}

function ensureToken() {
  return new Promise((resolve) => {
    if (state.token) return resolve(state.token);
    const dialog = document.getElementById('token-dialog');
    const errorEl = document.getElementById('token-error');
    let resolved = false;
    errorEl.style.display = 'none';
    dialog.showModal();
    dialog.addEventListener('cancel', (event) => {
      // Esc fires 'cancel' (not 'submit'). Prevent the default close - an
      // unset token breaks everything downstream, so keep the dialog open
      // and force the user back into it instead of letting it vanish.
      if (!resolved) event.preventDefault();
    });
    dialog.addEventListener('close', () => {
      // Defensive fallback: if the dialog closed some other way without a
      // resolved token (shouldn't normally happen since 'cancel' is
      // prevented above), reopen it rather than leaving init() hanging.
      if (!resolved) dialog.showModal();
    });
    document.getElementById('token-form').addEventListener('submit', (event) => {
      const value = document.getElementById('token-input').value.trim();
      if (!value) {
        event.preventDefault();
        errorEl.style.display = 'inline';
        return;
      }
      errorEl.style.display = 'none';
      setToken(value);
      state.token = value;
      resolved = true;
      resolve(value);
    });
  });
}

function changeToken() {
  setToken('');
  state.token = '';
  location.reload();
}

function getRepoOwner() {
  // Wird aus dem Hostnamen der GitHub-Pages-URL abgeleitet: <owner>.github.io
  const host = window.location.hostname;
  return host.endsWith('.github.io') ? host.replace('.github.io', '') : getUrlParam('owner');
}

const REPO_NAME = 'rf-dojos';

async function githubFetch(path) {
  const res = await fetch(`https://api.github.com${path}`, {
    headers: state.token ? { Authorization: `Bearer ${state.token}` } : {},
  });
  if (!res.ok) {
    const err = new Error(`GitHub API ${res.status} für ${path}`);
    err.status = res.status;
    err.remaining = res.headers.get('X-RateLimit-Remaining');
    throw err;
  }
  return res.json();
}

async function loadConfig(dojoId) {
  const owner = getRepoOwner();
  const data = await githubFetch(`/repos/${owner}/${REPO_NAME}/contents/dojos/${dojoId}/config.yaml`);
  const yamlText = decodeBase64Utf8(data.content);
  state.config = jsyaml.load(yamlText);
  render();
}

async function loadOpenPRs(dojoId) {
  const owner = getRepoOwner();
  const allOpen = await githubFetch(`/repos/${owner}/${REPO_NAME}/pulls?state=open&per_page=100`);
  const titlePrefix = `[${dojoId}]`;
  state.prs = allOpen
    .filter((pr) => pr.title.startsWith(titlePrefix))
    .map((pr) => ({
      username: pr.title.slice(titlePrefix.length).trim(),
      branch: pr.head.ref,
      // Teilnehmer forken das Repo (siehe TEILNEHMER.md) - der Branch liegt
      // also im Fork, nicht im Original-Repo. Ohne head.repo (z.B. Fork
      // gelöscht) bleibt nur der Fallback auf den Original-Owner.
      repoOwner: pr.head.repo ? pr.head.repo.owner.login : owner,
      number: pr.number,
    }))
    .sort((a, b) => a.username.localeCompare(b.username));
  render();
}

function buildTreeFromPaths(paths) {
  const root = {};
  for (const path of paths) {
    const parts = path.split('/');
    let node = root;
    parts.forEach((part, i) => {
      if (!node[part]) node[part] = i === parts.length - 1 ? null : {};
      if (node[part] !== null) node = node[part];
    });
  }
  return root;
}

function renderExplorerNode(name, subtree, fullRelPath, activeRelPath, matchingRelPaths, onSelect) {
  if (subtree === null) {
    const li = document.createElement('li');
    li.className = 'file' + (fullRelPath === activeRelPath ? ' active' : '');
    li.textContent = matchingRelPaths.has(fullRelPath) ? `🔶 ${name}` : name;
    li.addEventListener('click', () => onSelect(fullRelPath));
    return li;
  }
  const li = document.createElement('li');
  li.textContent = name + '/';
  const ul = document.createElement('ul');
  Object.entries(subtree).forEach(([childName, childSubtree]) => {
    const childPath = fullRelPath ? `${fullRelPath}/${childName}` : childName;
    ul.appendChild(renderExplorerNode(childName, childSubtree, childPath, activeRelPath, matchingRelPaths, onSelect));
  });
  li.appendChild(ul);
  return li;
}

function renderExplorerTree(container, relPaths, activeRelPath, matchingRelPaths, onSelect) {
  const tree = buildTreeFromPaths(relPaths);
  container.innerHTML = '';
  const ul = document.createElement('ul');
  Object.entries(tree).forEach(([name, subtree]) => {
    ul.appendChild(renderExplorerNode(name, subtree, name, activeRelPath, matchingRelPaths, onSelect));
  });
  container.appendChild(ul);
}

async function loadFileTree(owner, branch) {
  // Branch-Namen enthalten laut Workflow ein "/" (<dojo-id>/<username>) - muss
  // im Pfad-Segment encodiert werden, sonst schlägt die Ref-Auflösung fehl.
  const data = await githubFetch(`/repos/${owner}/${REPO_NAME}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
  return data.tree.filter((entry) => entry.type === 'blob').map((entry) => entry.path);
}

function escapeHtml(str) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return str.replace(/[&<>"']/g, (c) => map[c]);
}

function globToRegex(glob) {
  const escaped = glob.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*');
  return new RegExp(`^${escaped}$`);
}

function matchesAnyGlob(relPath, globs) {
  if (!globs || !globs.length) return false;
  return globs.some((glob) => globToRegex(glob).test(relPath));
}

function resolveExplorerFilter(dojoConfig, round) {
  const blacklist = [
    ...(dojoConfig?.explorer_blacklist || []),
    ...(round.explorer?.blacklist || []),
  ];
  const whitelist = round.explorer?.whitelist || [];
  return { blacklist, whitelist };
}

function filterExplorerPaths(relPaths, filter) {
  return relPaths.filter((relPath) => {
    if (filter.whitelist.length && !matchesAnyGlob(relPath, filter.whitelist)) return false;
    if (matchesAnyGlob(relPath, filter.blacklist)) return false;
    return true;
  });
}

function resolveDefaultOpenPaths(relPaths, round) {
  return relPaths.filter((relPath) => matchesAnyGlob(relPath, round.default_open || []));
}

function contentMatchesSearch(content, searchPattern) {
  if (!searchPattern) return false;
  return new RegExp(searchPattern, 'i').test(content);
}

async function loadFileContent(owner, path, branch) {
  const data = await githubFetch(`/repos/${owner}/${REPO_NAME}/contents/${path}?ref=${encodeURIComponent(branch)}`);
  return decodeBase64Utf8(data.content);
}

function renderTreeNode(name, subtree) {
  const escapedName = escapeHtml(name);
  if (subtree === null) return `<li>${escapedName}</li>`;
  const children = Object.entries(subtree).map(([k, v]) => renderTreeNode(k, v)).join('');
  return `<li>${escapedName}/<ul>${children}</ul></li>`;
}

function renderTreeView(container, paths) {
  const tree = buildTreeFromPaths(paths);
  const html = Object.entries(tree).map(([k, v]) => renderTreeNode(k, v)).join('');
  container.innerHTML = `<ul class="file-tree">${html}</ul>`;
}

let renderSeq = 0;

async function renderContent() {
  const seq = ++renderSeq;
  const round = (state.config?.rounds || [])[state.currentRoundIndex];
  const pr = state.prs[state.currentParticipantIndex];
  if (!state.prs.length) {
    showContentMessage('Noch keine offenen PRs für dieses Dojo gefunden.');
    return;
  }
  if (!round || !pr) { showContentMessage(''); return; }
  try {
    const prefix = `dojos/${state.dojoId}/submissions/${pr.username}/`;
    const paths = (await loadFileTreeCached(pr.repoOwner, pr.branch)).filter((p) => p.startsWith(prefix));
    if (seq !== renderSeq) return; // a newer render superseded this one; abandon silently
    if (!paths.length) {
      showContentMessage(`Keine Dateien unter ${prefix} gefunden.`);
      clearError();
      return;
    }
    showContentMessage('');
    document.getElementById('tree-view').style.display = round.show === 'tree' ? '' : 'none';
    document.getElementById('file-view').style.display = round.show === 'file' ? 'flex' : 'none';
    if (round.show === 'tree') {
      renderTreeView(document.getElementById('tree-view'), paths);
    } else if (round.show === 'file') {
      const prefixLen = prefix.length;
      const relPaths = paths.map((p) => p.slice(prefixLen));
      const absoluteByRel = new Map(paths.map((p) => [p.slice(prefixLen), p]));
      const filter = resolveExplorerFilter(state.config.dojo, round);
      const visibleRelPaths = filterExplorerPaths(relPaths, filter);
      if (!visibleRelPaths.length) {
        showContentMessage('Keine Dateien nach Explorer-Filter sichtbar für diese Runde.');
        clearError();
        return;
      }
      if (state.needsDefaultOpen) {
        const defaultPaths = resolveDefaultOpenPaths(relPaths, round);
        defaultPaths.forEach((relPath) => openTab(relPath));
        if (defaultPaths.length) {
          // Make the projector-visible starting file deterministic: always
          // the FIRST default_open match, not whichever one openTab() last
          // touched (which depended on incidental git-tree ordering).
          state.activeTabPath = state.openTabs[0];
        } else if (!state.openTabs.length && visibleRelPaths.length) {
          openTab(visibleRelPaths[0]);
        }
        state.needsDefaultOpen = false;
      }
      renderTabBar();

      const matchingRelPaths = await computeSearchMatchingPaths(pr.repoOwner, visibleRelPaths, absoluteByRel, pr.branch, round.search);
      if (seq !== renderSeq) return;
      renderExplorerTree(document.getElementById('explorer'), visibleRelPaths, state.activeTabPath, matchingRelPaths, (relPath) => {
        openTab(relPath);
        renderTabBar();
        renderContent();
      });

      if (state.activeTabPath) {
        // Split fetch/create-model from attach-to-editor so a newer render
        // (moderator flipping to another participant while this one's file
        // is still loading on a cold cache) can be detected and abandoned
        // BEFORE we clobber the editor with stale content via setModel().
        const model = await getModelFor(pr.repoOwner, state.activeTabPath, absoluteByRel.get(state.activeTabPath), pr.branch);
        if (seq !== renderSeq) return;
        ensureEditorInstance().setModel(model);
        applySearchDecorations(round.search);
      } else {
        ensureEditorInstance().setModel(null);
      }
    }
    if (seq !== renderSeq) return;
    clearError();
  } catch (err) {
    if (seq !== renderSeq) return; // a newer render already superseded this one
    showError(`Fehler beim Laden der Dateien für ${pr.username}: ${err.message}`);
  }
}

function handleKeydown(event) {
  if (!state.config) return;
  if (event.key === 'ArrowRight') {
    goToNextParticipant();
  } else if (event.key === 'ArrowLeft') {
    goToPrevParticipant();
  } else if (event.key === 'ArrowDown') {
    goToNextRound();
  } else if (event.key === 'ArrowUp') {
    goToPrevRound();
  }
}

document.addEventListener('keydown', handleKeydown);
document.getElementById('change-token-btn').addEventListener('click', changeToken);
document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
setTheme(getTheme());

function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.textContent = message;
  banner.style.display = 'block';
}

function clearError() {
  document.getElementById('error-banner').style.display = 'none';
}

function renderNoDojoMessage() {
  // Uses the same content-message host as showContentMessage() rather than
  // touching #content.innerHTML directly, so the persistent-DOM-host
  // invariant holds everywhere in this file, not just in renderContent().
  const messageEl = document.getElementById('content-message');
  messageEl.textContent = 'Kein Dojo ausgewählt. Wähle oben eines aus.';
  messageEl.style.display = '';
  document.getElementById('tree-view').style.display = 'none';
  document.getElementById('file-view').style.display = 'none';
}

function navigateToDojo(dojoId) {
  const params = new URLSearchParams(window.location.search);
  params.set('dojo', dojoId);
  window.location.search = params.toString();
}

async function loadDojoList() {
  const owner = getRepoOwner();
  if (!owner) {
    throw new Error('Repo-Owner unbekannt — bitte ?owner=<github-user> an die URL anhängen.');
  }
  const entries = await githubFetch(`/repos/${owner}/${REPO_NAME}/contents/dojos`);
  const dirs = entries.filter((entry) => entry.type === 'dir');
  const dojos = [];
  for (const dir of dirs) {
    let title = dir.name;
    try {
      const data = await githubFetch(`/repos/${owner}/${REPO_NAME}/contents/dojos/${dir.name}/config.yaml`);
      const config = jsyaml.load(decodeBase64Utf8(data.content));
      if (config?.dojo?.title) title = config.dojo.title;
    } catch (err) {
      console.warn(`Konnte config.yaml für ${dir.name} nicht laden:`, err);
    }
    dojos.push({ id: dir.name, title });
  }
  dojos.sort((a, b) => a.id.localeCompare(b.id));
  return dojos;
}

function renderDojoSelect(dojos) {
  const select = document.getElementById('dojo-select');
  select.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = dojos.length ? 'Dojo wählen…' : 'Keine Dojos gefunden';
  select.appendChild(placeholder);
  dojos.forEach((dojo) => {
    const opt = document.createElement('option');
    opt.value = dojo.id;
    opt.textContent = dojo.title;
    if (dojo.id === state.dojoId) opt.selected = true;
    select.appendChild(opt);
  });
}

document.getElementById('dojo-select').addEventListener('change', (event) => {
  if (event.target.value) navigateToDojo(event.target.value);
});

async function init() {
  await ensureToken();
  try {
    renderDojoSelect(await loadDojoList());
  } catch (err) {
    console.warn('Konnte Dojo-Liste nicht laden:', err);
  }
  if (!state.dojoId) {
    renderNoDojoMessage();
    return;
  }
  try {
    await loadConfig(state.dojoId);
    await loadOpenPRs(state.dojoId);
    clearError();
  } catch (err) {
    if (err.status === 403 && err.remaining === '0') {
      showError('GitHub Rate Limit erreicht. Bitte kurz warten oder Token prüfen.');
    } else if (err.status === 404) {
      showError(`Nicht gefunden: ${err.message}. Existiert das Dojo/die config.yaml?`);
    } else {
      showError(`Fehler beim Laden: ${err.message}`);
    }
  }
}

if (typeof require === 'undefined') {
  showError('Monaco-Editor-Assets konnten nicht geladen werden (vendor/monaco/...). Seite neu laden.');
} else {
  require.config({ paths: { vs: 'vendor/monaco/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    registerRobotFrameworkLanguage(monaco);
    init();
  }, function (err) {
    showError(`Monaco konnte nicht initialisiert werden: ${err.message}`);
  });
}
</script>
