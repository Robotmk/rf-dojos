dojo:
  id: dojo-01-web-testing
  title: "Web Testing Dojo #1"
  date: "2026-07-30"
  target_app: "https://sampleapp.tricentis.com/101/"
  explorer_blacklist: ["*.png", "*.jpg", "*.gif", "*.zip", "*.pyc", "*__pycache__/*", "output.xml", "log.html", "report.html", ".git*", "README.md"]

rounds:
  - id: environment
    title: "Environment"
    description: "Wie wurde Robot Framework installiert? Welche Libraries? Welche Versionen?"
    show: file
    default_open: ["conda.yaml", "requirements.txt", "*.toml", "*.ini", "*.cfg", "package.json", "pyproject.toml", "Pipfile", "Pipfile.lock", "poetry.lock"]
    search: "robotframework-browser"
    # explorer:
    #   blacklist: ["*.md"]               # rundenspezifisch, zusätzlich zum dojo-weiten explorer_blacklist
    #   whitelist: ["tests/*", "resources/*"]  # falls gesetzt: NUR diese Dateien werden überhaupt angezeigt    

  - id: browserlib
    title: "Browser Library"
    description: "Import Parameter, Browser-Optionen, Headless, Browser-Version, ..."
    show: file
    default_open: ["*.robot", "*.resource"]       
    search: "Library\s+Browser|headless"     # markiert Dateien mit Treffern im Explorer (🔶)

  - id: highlevel_kw
    title: "Testcase"
    description: "Aufbau des Testcases, High-Level Keywords, Struktur, Lesbarkeit"
    show: file
    default_open: ["*.robot", "*.resource"]       
    search: "Test Case|Test Cases"   
  
  - id: vehicle_data
    title: "Eingabe 'Vehicle Data'"
    description: "Datum, Dropdown, Radio Buttons"
    show: file
    default_open: ["*.robot", "*.resource"]       
    # search: "Fill Text"     # markiert Dateien mit Treffern im Explorer (🔶)

  - id: insurant_data
    title: "Eingabe 'Insurant Data'"
    description: "valides Geburtsdatum, Checkboxen"
    show: file
    default_open: ["*.robot", "*.resource"]       
    # search: "Fill Text"     # markiert Dateien mit Treffern im Explorer (🔶)

  - id: product_data
    title: "Eingabe 'Product Data'"
    description: "valides Startdatum, Checkbox-Selektor"
    show: file
    default_open: ["*.robot", "*.resource"]       
    # search: "Fill Text"     # markiert Dateien mit Treffern im Explorer (🔶)

  - id: price_option
    title: "Eingabe 'Price Option'"
    description: "Checkbox-Selektor"
    show: file
    default_open: ["*.robot", "*.resource"]       
    # search: "Fill Text"     # markiert Dateien mit Treffern im Explorer (🔶)

  - id: send_quote
    title: "Send Quote"
    description: "Warten auf Versandbestätigung"
    show: file
    default_open: ["*.robot", "*.resource"]       
    # search: "Fill Text"     # markiert Dateien mit Treffern im Explorer (🔶)

  - id: screenshots
    title: "Browser Library"
    description: "Screenshots on Failure"
    show: file
    default_open: ["*.robot", "*.resource"]       
    search: "run_on_failure|Screenshot"     # markiert Dateien mit Treffern im Explorer (🔶)