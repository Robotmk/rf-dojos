dojo:
  id: dojo-01-web-testing
  title: "Web Testing Dojo #1"
  date: "2026-07-30"
  target_app: "https://sampleapp.tricentis.com/101/"
  explorer_blacklist: ["*.png", "*.jpg", "*.gif", "*.zip", "*.pyc", "*__pycache__/*", "output.xml", "log.html", "report.html", ".git*", "README.md"]

rounds:
  - id: environment
    title: "Environment"
    description: "Wie wurde Robot Framework installiert? Welche Libraries? Welche Versionen?"
    show: file
    default_open: ["conda.yaml", "requirements.txt", "*.toml", "*.ini", "*.cfg", "package.json", "pyproject.toml", "Pipfile", "Pipfile.lock", "poetry.lock"]
    search: "robotframework-browser"
    # explorer:
    #   blacklist: ["*.md"]               # rundenspezifisch, zusätzlich zum dojo-weiten explorer_blacklist
    #   whitelist: ["tests/*", "resources/*"]  # falls gesetzt: NUR diese Dateien werden überhaupt angezeigt    

  - id: locators
    title: "Locator-Strategie"
    description: "Wie werden Elemente gefunden?"
    show: file
    default_open: ["tests/*.robot"]     # welche Datei(en) beim Öffnen der Runde aktiv sind
    explorer:
      blacklist: ["*.md"]               # rundenspezifisch, zusätzlich zum dojo-weiten explorer_blacklist
      whitelist: ["tests/*", "resources/*"]  # falls gesetzt: NUR diese Dateien werden überhaupt angezeigt
    search: "locator|css|xpath|id="     # markiert Dateien mit Treffern im Explorer (🔶)
  # ... weitere Runden, siehe bestehende config.yaml als Vorlage
